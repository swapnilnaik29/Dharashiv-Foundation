<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Connections | Dharashiv Foundation</title>
  <meta name="description" content="Manage your professional network and connection requests on Dharashiv Foundation.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content" style="max-width: 900px;">

        <div class="page-header">
          <div>
            <h1 class="page-title">My Professional Network</h1>
            <p class="page-subtitle">Manage incoming connection requests and your active partnerships in Dharashiv.</p>
          </div>
          <a href="/discover.html" class="btn btn-primary">+ Discover Members</a>
        </div>

        <!-- Incoming Requests Section -->
        <div style="margin-bottom: 2.5rem;">
          <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--color-primary-dark-brown); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>📥</span> Incoming Connection Requests
          </h2>
          <div id="pendingRequestsList"></div>
        </div>

        <!-- Active Connections Section -->
        <div>
          <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--color-primary-dark-brown); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>🤝</span> Connected Members
          </h2>
          <div id="activeConnectionsList"></div>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { initConnectionsPage } from '/js/connections.js';

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      await initNavigation('connections');
      await initConnectionsPage();
    })();
  </script>
</body>
</html>
