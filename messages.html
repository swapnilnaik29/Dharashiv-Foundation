<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Messages | Dharashiv Foundation</title>
  <meta name="description" content="Chat directly with connected entrepreneurs and professionals on Dharashiv Foundation.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .chat-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - var(--header-height) - 4rem);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .chat-sidebar {
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      background: var(--color-warm-bg);
    }
    .chat-sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--color-border);
      font-weight: 700;
      color: var(--color-primary-dark-brown);
      font-size: 1rem;
    }
    .chat-main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-body {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background: #FAF8F5;
    }
    .chat-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      background: var(--color-warm-bg);
      font-size: var(--font-size-sm);
    }
    .chat-input:focus {
      background: #FFFFFF;
      border-color: var(--color-primary-orange);
      outline: none;
    }
    @media (max-width: 768px) {
      .chat-layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 500px;
      }
      .chat-sidebar {
        max-height: 200px;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content" style="padding-top: 1rem;">

        <div class="chat-layout">
          <!-- Left Conversations List -->
          <div class="chat-sidebar">
            <div class="chat-sidebar-header">
              <span>Messages & Networking Chats</span>
            </div>
            <div id="conversationsList" style="flex: 1; overflow-y: auto;"></div>
          </div>

          <!-- Right Active Chat Window -->
          <div class="chat-main">
            <div class="chat-header" id="chatRecipientHeader">
              <div style="color: var(--color-text-muted); font-size: 0.9rem;">
                Select a conversation from the left to start messaging.
              </div>
            </div>

            <div class="chat-body" id="chatMessages">
              <div style="text-align: center; color: var(--color-text-muted); padding-top: 4rem;">
                No active chat selected.
              </div>
            </div>

            <div class="chat-footer">
              <input type="text" id="chatMessageInput" class="chat-input" placeholder="Type your message..." />
              <button class="btn btn-primary" id="sendMessageBtn">
                Send
              </button>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { initMessagesPage } from '/js/messages.js';

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      await initNavigation('messages');
      await initMessagesPage();
    })();
  </script>
</body>
</html>
