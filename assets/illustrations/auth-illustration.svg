<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0E2" />
      <stop offset="50%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#FFE5CF" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0E2" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A18" />
      <stop offset="100%" stop-color="#A83208" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#702507" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="400" rx="20" fill="url(#skyGrad)"/>

  <!-- Subtle Network Graph in Background -->
  <g stroke="#E8E1DA" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8">
    <line x1="80" y1="120" x2="250" y2="90" />
    <line x1="250" y1="90" x2="420" y2="130" />
    <line x1="80" y1="120" x2="140" y2="240" />
    <line x1="250" y1="90" x2="250" y2="220" />
    <line x1="420" y1="130" x2="360" y2="240" />
    <line x1="140" y1="240" x2="250" y2="220" />
    <line x1="250" y1="220" x2="360" y2="240" />
  </g>

  <!-- Cloud Computing Infrastructure Base -->
  <g filter="url(#softShadow)">
    <path d="M180 130 C180 100 205 78 235 78 C242 78 250 80 256 83 C265 67 282 56 302 56 C332 56 356 79 356 108 C366 109 375 118 375 130 C375 143 364 153 350 153 L195 153 C187 153 180 143 180 130 Z" fill="url(#cloudGrad)" stroke="#E8E1DA" stroke-width="2"/>
    <!-- Cloud Shield / Security Lock -->
    <circle cx="280" cy="112" r="18" fill="#FFF0E2" />
    <path d="M274 114 H286 V122 H274 Z" fill="#A83208" />
    <path d="M276 114 V110 C276 107.5 277.8 106 280 106 C282.2 106 284 107.5 284 110 V114" stroke="#A83208" stroke-width="2" fill="none"/>
  </g>

  <!-- Central Dharashiv Arch & Community Hub -->
  <g filter="url(#softShadow)" transform="translate(160, 180)">
    <rect x="0" y="0" width="180" height="150" rx="16" fill="#FFFFFF" stroke="#E8E1DA" stroke-width="1.5" />
    <!-- Fort Arch Window -->
    <path d="M50 150 V 65 C50 42 68 25 90 25 C112 25 130 42 130 65 V 150" fill="#FFF0E2" stroke="#702507" stroke-width="3" />
    <circle cx="90" cy="25" r="7" fill="#FF7A18" />
    <path d="M72 150 V 85 C72 75 80 67 90 67 C100 67 108 75 108 85 V 150" fill="#702507" />
    <!-- Rising Sun over Hub -->
    <path d="M68 62 Q 90 48 112 62" stroke="#FF7A18" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Left Networking Member Badge -->
  <g filter="url(#softShadow)" transform="translate(45, 170)">
    <rect x="0" y="0" width="105" height="110" rx="14" fill="#FFFFFF" stroke="#E8E1DA" stroke-width="1.5" />
    <circle cx="52" cy="40" r="22" fill="#FFF0E2" stroke="#FF7A18" stroke-width="2"/>
    <circle cx="52" cy="35" r="9" fill="#702507" />
    <path d="M38 56 C38 48 44 44 52 44 C60 44 66 48 66 56" fill="#A83208" />
    <rect x="22" y="72" width="60" height="8" rx="4" fill="#702507" />
    <rect x="30" y="86" width="44" height="6" rx="3" fill="#A83208" opacity="0.6" />
    <circle cx="86" cy="22" r="9" fill="#10B981" />
    <path d="M83 22 L85 24 L89 20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Business Member Badge -->
  <g filter="url(#softShadow)" transform="translate(350, 170)">
    <rect x="0" y="0" width="105" height="110" rx="14" fill="#FFFFFF" stroke="#E8E1DA" stroke-width="1.5" />
    <circle cx="52" cy="40" r="22" fill="#FFF0E2" stroke="#A83208" stroke-width="2"/>
    <circle cx="52" cy="35" r="9" fill="#A83208" />
    <path d="M38 56 C38 48 44 44 52 44 C60 44 66 48 66 56" fill="#702507" />
    <rect x="20" y="72" width="65" height="8" rx="4" fill="#702507" />
    <rect x="26" y="86" width="52" height="6" rx="3" fill="#FF7A18" opacity="0.8" />
    <circle cx="86" cy="22" r="9" fill="#FF7A18" />
    <!-- Briefcase / Deal icon -->
    <rect x="82" y="20" width="8" height="6" rx="1" fill="#FFFFFF" />
  </g>

  <!-- Connected Pulse Lines -->
  <path d="M150 225 Q 155 225 160 225" stroke="#FF7A18" stroke-width="3" stroke-linecap="round"/>
  <path d="M340 225 Q 345 225 350 225" stroke="#FF7A18" stroke-width="3" stroke-linecap="round"/>

  <!-- Regional Badges (Talukas of Dharashiv) -->
  <g transform="translate(110, 345)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#FFFFFF" stroke="#E8E1DA" stroke-width="1" filter="url(#softShadow)"/>
    <text x="140" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#702507">
      📍 Dharashiv • Tuljapur • Omerga • Paranda • Kalamb
    </text>
  </g>
</svg>
