<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A18" />
      <stop offset="50%" stop-color="#A83208" />
      <stop offset="100%" stop-color="#702507" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF7A18" />
      <stop offset="100%" stop-color="#FFA858" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#702507" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield / Hexagon Shape -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#dfGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="50" cy="50" r="38" stroke="#FFF0E2" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Rising Sun / Radiance Arc -->
  <path d="M28 58 Q 50 34 72 58" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Central Fort Arch & Community Pillar (stylized 'D') -->
  <path d="M38 72 V 36 C38 29 44 24 51 24 C58 24 64 29 64 36 V 72" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M44 72 V 42 C44 38 47 34 51 34 C55 34 58 38 58 42 V 72" stroke="#FFF0E2" stroke-width="3" fill="#FFF0E2" fill-opacity="0.15" />

  <!-- Interconnected Network Nodes -->
  <circle cx="51" cy="24" r="5" fill="#FF7A18" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="28" cy="58" r="4.5" fill="#FFA858" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="72" cy="58" r="4.5" fill="#FFA858" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="38" cy="72" r="3.5" fill="#FFFFFF" />
  <circle cx="64" cy="72" r="3.5" fill="#FFFFFF" />

  <!-- Connection Bridges -->
  <line x1="28" y1="58" x2="38" y2="72" stroke="#FFF0E2" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="72" y1="58" x2="64" y2="72" stroke="#FFF0E2" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
