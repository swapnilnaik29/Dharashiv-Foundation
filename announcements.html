<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements | Dharashiv Foundation</title>
  <meta name="description" content="Official community notices and verified announcements across Dharashiv.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content" style="max-width: 860px;">

        <div class="page-header">
          <div>
            <h1 class="page-title">Community Announcements</h1>
            <p class="page-subtitle">Official platform updates, government schemes, and community notifications for Dharashiv.</p>
          </div>
          <button class="btn btn-primary" id="openSubmitAnnouncementBtn">+ Submit Notice</button>
        </div>

        <div id="announcementsListContainer"></div>

      </main>
    </div>
  </div>

  <!-- Submit Announcement Modal -->
  <div class="modal-backdrop" id="submitAnnouncementModal">
    <div class="modal-container" style="max-width: 580px;">
      <div class="modal-header">
        <h3 class="modal-title">Submit Community Announcement</h3>
        <button class="modal-close" data-dismiss="modal">&times;</button>
      </div>
      <form id="submitAnnouncementForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="annTitle">Notice Headline <span class="required">*</span></label>
            <input type="text" id="annTitle" class="form-control" placeholder="e.g. Subsidy Scheme for Solar Water Heaters" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="annPriority">Notice Priority</label>
            <select id="annPriority" class="form-select">
              <option value="normal">Normal</option>
              <option value="high">High Priority</option>
              <option value="urgent">Urgent / Time-Sensitive</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="annContent">Announcement Details <span class="required">*</span></label>
            <textarea id="annContent" class="form-textarea" required placeholder="Write the complete announcement details, dates, and instructions..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitAnnBtn">Submit for Review</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { initAnnouncementsPage } from '/js/announcements.js';
    import { setupModalDismissers } from '/js/ui.js';

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      await initNavigation('announcements');
      setupModalDismissers();
      await initAnnouncementsPage();
    })();
  </script>
</body>
</html>
