<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Feed | Dharashiv Foundation</title>
  <meta name="description" content="Dharashiv Foundation Social Feed — updates, projects, and discussions across Dharashiv.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/feed.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content" style="max-width: 800px;">

        <div class="page-header">
          <div>
            <h1 class="page-title">Community Feed</h1>
            <p class="page-subtitle">Share business milestones, regional updates, and collaborative thoughts.</p>
          </div>
        </div>

        <!-- Post Creation Card -->
        <div class="create-post-card">
          <div class="create-post-top">
            <img src="/assets/avatars/default-avatar.svg" id="currentUserAvatar" class="create-post-avatar" alt="You" />
            <div style="flex: 1;">
              <textarea id="postContentInput" class="create-post-input" placeholder="What's happening in your business or taluka? Share an update..."></textarea>
            </div>
          </div>

          <!-- Media Preview (hidden until photo chosen) -->
          <div id="mediaPreviewContainer" class="media-preview-container">
            <button type="button" id="removeMediaBtn" class="media-preview-remove">✕</button>
            <img id="mediaPreviewImg" src="" class="media-preview-img" alt="Upload preview" />
          </div>

          <div class="create-post-bottom">
            <div style="display: flex; gap: 0.75rem; align-items: center;">
              <input type="file" id="postFileInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display: none;" />
              <button type="button" class="post-action-btn" id="addPhotoBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                Add Image
              </button>

              <select id="postCategorySelect" class="form-select" style="padding: 0.35rem 0.65rem; font-size: 0.8rem; width: auto;">
                <option value="General">General</option>
                <option value="Agriculture & Agri-Tech">Agriculture & Agri-Tech</option>
                <option value="Manufacturing & Engineering">Manufacturing & Engineering</option>
                <option value="Information Technology & Software">Information Technology & Software</option>
                <option value="Healthcare & Pharmaceuticals">Healthcare & Pharmaceuticals</option>
                <option value="Renewable Energy & Solar">Renewable Energy & Solar</option>
                <option value="Retail & Trade">Retail & Trade</option>
                <option value="Education">Education</option>
              </select>
            </div>

            <button type="button" class="btn btn-primary" id="submitPostBtn">
              Publish Post
            </button>
          </div>
        </div>

        <!-- Feed Filter Tabs -->
        <div class="tabs-nav" id="feedCategoryTabs">
          <button class="tab-btn active" data-category="All">All Posts</button>
          <button class="tab-btn" data-category="Agriculture & Agri-Tech">Agri-Tech</button>
          <button class="tab-btn" data-category="Renewable Energy & Solar">Solar & Energy</button>
          <button class="tab-btn" data-category="Information Technology & Software">Tech & Cloud</button>
          <button class="tab-btn" data-category="General">General</button>
        </div>

        <!-- Feed List -->
        <div id="feedList"></div>

      </main>
    </div>
  </div>

  <!-- Report Post Modal -->
  <div class="modal-backdrop" id="reportModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Report Inappropriate Content</h3>
        <button class="modal-close" data-dismiss="modal">&times;</button>
      </div>
      <form id="reportForm">
        <div class="modal-body">
          <input type="hidden" id="reportTargetId" value="" />
          <div class="form-group">
            <label class="form-label" for="reportReason">Reason for Report <span class="required">*</span></label>
            <select id="reportReason" class="form-select" required>
              <option value="Spam or Advertising">Spam or Irrelevant Advertising</option>
              <option value="Harassment or Hate Speech">Harassment or Hate Speech</option>
              <option value="Misleading Information">Misleading / False Information</option>
              <option value="Inappropriate Content">Inappropriate Content</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="reportDetails">Additional Details (Optional)</label>
            <textarea id="reportDetails" class="form-textarea" placeholder="Provide extra context to assist admin moderators..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { initFeed, loadFeed } from '/js/posts.js';
    import { setupModalDismissers } from '/js/ui.js';

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      await initNavigation('feed');
      setupModalDismissers();
      await initFeed();

      // Category filter tabs
      document.querySelectorAll('#feedCategoryTabs .tab-btn').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#feedCategoryTabs .tab-btn').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          loadFeed(tab.dataset.category);
        });
      });
    })();
  </script>
</body>
</html>
