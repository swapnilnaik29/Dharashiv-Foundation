<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Applications | Dharashiv Foundation</title>
  <meta name="description" content="Track your job applications and review candidate resumes on Dharashiv Foundation.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/jobs.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content" style="max-width: 960px;">

        <div class="page-header">
          <div>
            <h1 class="page-title">Application Management</h1>
            <p class="page-subtitle">Track your job applications and review candidate resumes submitted to your vacancies.</p>
          </div>
          <a href="/jobs.html" class="btn btn-primary">Browse Jobs</a>
        </div>

        <!-- Application Tabs -->
        <div class="tabs-nav">
          <button class="tab-btn active" id="tabCandidateApps">My Submitted Applications</button>
          <button class="tab-btn" id="tabEmployerApps">Applications Received (Employer View)</button>
        </div>

        <!-- Candidate Applications Section -->
        <div id="candidateAppsSection">
          <div id="myApplicationsList"></div>
        </div>

        <!-- Employer Received Section -->
        <div id="employerAppsSection" style="display: none;">
          <div style="background: var(--color-light-orange); border: 1px solid rgba(255,122,24,0.3); border-radius: var(--radius-sm); padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--color-primary-dark-brown); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>🛡️</span>
            <span><strong>Private S3 Downloads:</strong> Resume download links are generated dynamically on demand and expire automatically after 2 minutes.</span>
          </div>
          <div id="receivedApplicationsList"></div>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { initApplicationsPage } from '/js/applications.js';

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      await initNavigation('applications');
      await initApplicationsPage();
    })();
  </script>
</body>
</html>
