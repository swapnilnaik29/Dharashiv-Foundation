<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Session | Dharashiv Foundation</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .callback-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .spinner-ring {
      width: 56px;
      height: 56px;
      border: 4px solid var(--color-light-orange);
      border-top-color: var(--color-primary-orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="callback-container">
    <img src="/assets/logos/logo-compact.svg" alt="Dharashiv Foundation" style="width: 72px; height: 72px; margin-bottom: 1.5rem;" />
    <div class="spinner-ring"></div>
    <h2 style="font-size: 1.5rem; color: var(--color-primary-dark-brown); font-weight: 700; margin-bottom: 0.5rem;">
      Authenticating with Google Cloud...
    </h2>
    <p id="callbackStatus" style="color: var(--color-text-secondary); max-width: 400px; font-size: 0.95rem;">
      Establishing secure Supabase session and checking member profile status.
    </p>
  </div>

  <script type="module">
    import { handleAuthCallback } from '/js/auth.js';

    (async () => {
      try {
        await handleAuthCallback();
      } catch (err) {
        console.error('Callback error:', err);
        document.getElementById('callbackStatus').innerHTML = `
          <span style="color: var(--color-error);">Authentication Failed: ${err.message}</span>
          <br><br>
          <a href="/login.html" class="btn btn-primary" style="margin-top: 1rem;">Back to Sign In</a>
        `;
      }
    })();
  </script>
</body>
</html>
