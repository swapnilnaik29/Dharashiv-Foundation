<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Members | Dharashiv Foundation Admin</title>
  <meta name="description" content="Manage registered platform members and role assignments.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content">

        <div class="page-header">
          <div>
            <h1 class="page-title">Member Account Management</h1>
            <p class="page-subtitle">Review registered users across all talukas, activate/deactivate accounts, and manage administrative roles.</p>
          </div>
          <a href="/admin/index.html" class="btn btn-secondary">← Back to Overview</a>
        </div>

        <div class="card" style="margin-bottom: 1.5rem; padding: 1rem;">
          <input type="text" id="adminMemberSearch" class="form-control" placeholder="Search by member name, email, or native village..." />
        </div>

        <div class="data-table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Member Profile</th>
                <th>Taluka</th>
                <th>Profession</th>
                <th>Assigned Role</th>
                <th>Account Status</th>
                <th>Management Action</th>
              </tr>
            </thead>
            <tbody id="adminMembersTableBody">
              <!-- Dynamically populated via js/admin.js -->
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { loadRecentMembersTable } from '/js/admin.js';

    (async () => {
      const auth = await requireAdmin();
      if (!auth) return;

      await initNavigation('admin');
      await loadRecentMembersTable();
    })();
  </script>
</body>
</html>
