<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Moderation | Dharashiv Foundation Admin</title>
  <meta name="description" content="Review flagged content and inappropriate reports.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content" style="max-width: 900px;">

        <div class="page-header">
          <div>
            <h1 class="page-title">Content Moderation Queue</h1>
            <p class="page-subtitle">Inspect flagged posts, inappropriate comments, and enforce community standards.</p>
          </div>
          <a href="/admin/index.html" class="btn btn-secondary">← Back to Overview</a>
        </div>

        <div id="moderationQueueContainer"></div>

      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { initModerationQueue } from '/js/admin.js';

    (async () => {
      const auth = await requireAdmin();
      if (!auth) return;

      await initNavigation('admin');
      await initModerationQueue();
    })();
  </script>
</body>
</html>
