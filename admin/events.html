<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events | Dharashiv Foundation Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content">

        <div class="page-header">
          <div>
            <h1 class="page-title">Event Scheduling & Management</h1>
            <p class="page-subtitle">Publish regional workshops, manage attendance capacity, and coordinate district summits.</p>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <a href="/admin/index.html" class="btn btn-secondary">← Back to Overview</a>
            <a href="/events.html" class="btn btn-primary">Live Events Calendar</a>
          </div>
        </div>

        <div class="data-table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Event Title</th>
                <th>Taluka & Venue</th>
                <th>Date & Time</th>
                <th>Category</th>
                <th>Attendees</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="adminEventsTableBody"></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { mockStore } from '/js/mock-store.js';
    import { getSupabase } from '/js/supabase-client.js';
    import { escapeHtml, formatDateTime, showToast } from '/js/ui.js';

    (async () => {
      const auth = await requireAdmin();
      if (!auth) return;

      await initNavigation('admin');
      await loadAdminEvents();
    })();

    async function loadAdminEvents() {
      const tbody = document.getElementById('adminEventsTableBody');
      const supabase = await getSupabase();
      let events = [];

      if (supabase.isMock) {
        events = mockStore.getEvents();
      } else {
        const { data } = await supabase.from('events').select('*').order('event_date', { ascending: true });
        events = data || [];
      }

      tbody.innerHTML = events.map(e => `
        <tr id="admin-evt-${e.id}">
          <td style="font-weight: 600; color: var(--color-primary-dark-brown);">${escapeHtml(e.title)}</td>
          <td>${escapeHtml(e.venue)}, ${escapeHtml(e.taluka)}</td>
          <td>${formatDateTime(e.event_date)}</td>
          <td><span class="badge badge-orange">${escapeHtml(e.category)}</span></td>
          <td><strong>${e.attendees_count || 0}</strong> / ${e.capacity || '100'}</td>
          <td>
            <button class="btn btn-sm btn-danger delete-admin-evt-btn" data-evt-id="${e.id}">Delete</button>
          </td>
        </tr>
      `).join('');

      document.querySelectorAll('.delete-admin-evt-btn').forEach(b => {
        b.addEventListener('click', async () => {
          if (confirm('Delete this event?')) {
            const eid = b.dataset.evtId;
            if (supabase.isMock) {
              mockStore.data.events = mockStore.data.events.filter(e => e.id !== eid);
              mockStore.save();
            } else {
              await supabase.from('events').delete().eq('id', eid);
            }
            showToast('Event removed.', 'info');
            document.getElementById(`admin-evt-${eid}`)?.remove();
          }
        });
      });
    }
  </script>
</body>
</html>
