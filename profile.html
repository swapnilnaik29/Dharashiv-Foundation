<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Profile | Dharashiv Foundation</title>
  <meta name="description" content="View member profile, business information, and networking interests on Dharashiv Foundation.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/profile.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <div class="app-main">
      <div id="headerContainer"></div>

      <main class="app-content">
        <div id="profileContentContainer"></div>
      </main>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-backdrop" id="editProfileModal">
    <div class="modal-container" style="max-width: 680px;">
      <div class="modal-header">
        <h3 class="modal-title">Edit Member Profile</h3>
        <button class="modal-close" data-dismiss="modal">&times;</button>
      </div>
      <form id="editProfileForm">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="editFullName">Full Name</label>
              <input type="text" id="editFullName" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="editTaluka">Taluka</label>
              <select id="editTaluka" class="form-select">
                <option value="Dharashiv">Dharashiv</option>
                <option value="Tuljapur">Tuljapur</option>
                <option value="Omerga">Omerga</option>
                <option value="Paranda">Paranda</option>
                <option value="Bhoom">Bhoom</option>
                <option value="Kalamb">Kalamb</option>
                <option value="Washi">Washi</option>
                <option value="Lohara">Lohara</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="editVillage">Native Village</label>
              <input type="text" id="editVillage" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label" for="editCity">Current City</label>
              <input type="text" id="editCity" class="form-control" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="editCompany">Company / Enterprise Name</label>
              <input type="text" id="editCompany" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label" for="editCategory">Industry Category</label>
              <select id="editCategory" class="form-select">
                <option value="Information Technology & Software">Information Technology & Software</option>
                <option value="Agriculture & Agri-Tech">Agriculture & Agri-Tech</option>
                <option value="Manufacturing & Engineering">Manufacturing & Engineering</option>
                <option value="Healthcare & Pharmaceuticals">Healthcare & Pharmaceuticals</option>
                <option value="Renewable Energy & Solar">Renewable Energy & Solar</option>
                <option value="Retail & Wholesale Trade">Retail & Wholesale Trade</option>
                <option value="Education & Skill Training">Education & Skill Training</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="editDesc">Enterprise Description</label>
            <textarea id="editDesc" class="form-textarea"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="editServices">Services Offered</label>
            <input type="text" id="editServices" class="form-control" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="editWebsite">Website URL</label>
              <input type="url" id="editWebsite" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label" for="editLinkedIn">LinkedIn URL</label>
              <input type="url" id="editLinkedIn" class="form-control" />
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/guards.js';
    import { initNavigation } from '/js/navigation.js';
    import { initProfilePage } from '/js/profiles.js';
    import { setupModalDismissers } from '/js/ui.js';

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;

      await initNavigation('profile');
      setupModalDismissers();
      await initProfilePage();
    })();
  </script>
</body>
</html>
